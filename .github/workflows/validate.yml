name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate build recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration and script syntax
        run: |
          python3 scripts/check-upstream.py --validate
          python3 -m compileall -q scripts
          find scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          git diff --check
      - uses: docker/setup-buildx-action@v3
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
      - name: Parse Docker build targets without compiling native code
        run: |
          docker buildx build --call=targets -f docker/linux.Dockerfile .
          docker buildx build --call=targets -f docker/alpine.Dockerfile .
          docker buildx build --call=targets -f docker/packages.Dockerfile .
  documentation:
    name: Synchronize changed Docker Hub documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tdlib-documentation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update Docker Hub overview when publishing is configured
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER || 'vs69' }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_PASSWORD" ]; then
            python3 scripts/publish.py docs --allow-missing-repository
          else
            echo 'Docker Hub documentation sync will start after DOCKER_PASSWORD is configured.'
          fi
