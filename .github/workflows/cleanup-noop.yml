name: Remove unchanged scheduled checks
on:
  workflow_run:
    workflows: [Build and publish TDLib]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: tdlib-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove only verified no-change scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/cleanup-noop.py --run-id "$TARGET_RUN_ID"
